<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <title>Thermal Tech Study</title>
  <meta name="description" content="Independent study app for the Vertiv / Liebert Level 1 Thermal Management Technician exam.">
  <meta name="theme-color" content="#14213d">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
  <meta name="apple-mobile-web-app-title" content="Tech Study">
  <link rel="manifest" href="manifest.json">
  <link rel="icon" href="icons/icon-192.png" type="image/png">
  <link rel="apple-touch-icon" href="icons/apple-touch-icon.png">
  <link rel="stylesheet" href="styles.css">
</head>
<body>
  <header class="topbar" id="topbar">
    <button class="back-btn" id="backBtn" type="button" hidden>&#8249; Home</button>
    <h1 class="topbar-title" id="topTitle">Thermal Tech Study</h1>
    <span class="topbar-right" id="topRight"></span>
  </header>

  <main id="app" class="container" tabindex="-1">
    <p class="loading">Loading study material&hellip;</p>
  </main>

  <div class="modal-backdrop" id="modal" hidden>
    <div class="modal" role="dialog" aria-modal="true" aria-labelledby="modalTitle">
      <h2 id="modalTitle"></h2>
      <div id="modalBody"></div>
      <div class="modal-actions" id="modalActions"></div>
    </div>
  </div>

  <noscript><p class="container">This app needs JavaScript turned on.</p></noscript>
  <script src="app.js"></script>
</body>
</html>
